<body>
  <main class="app" aria-label="隔空手势画板">
    <video id="camera" playsinline muted aria-label="摄像头实时画面"></video>
    <canvas id="paint" aria-label="绘画画布"></canvas>
    <canvas id="guide" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <p id="welcome" class="welcome">good morning! welcome to my life!</p>

    <nav class="palette" aria-label="画笔颜色">
      <button class="swatch selected" data-color="#FFFFFF" style="--swatch:#FFFFFF" aria-label="白色" aria-pressed="true"></button>
      <button class="swatch" data-color="#111111" style="--swatch:#111111" aria-label="黑色" aria-pressed="false"></button>
      <button class="swatch" data-color="#FF3B30" style="--swatch:#FF3B30" aria-label="红色" aria-pressed="false"></button>
      <button class="swatch" data-color="#FF6FB5" style="--swatch:#FF6FB5" aria-label="粉色" aria-pressed="false"></button>
      <button class="swatch" data-color="#3A86FF" style="--swatch:#3A86FF" aria-label="蓝色" aria-pressed="false"></button>
      <button class="swatch" data-color="#34C759" style="--swatch:#34C759" aria-label="绿色" aria-pressed="false"></button>
      <button class="swatch" data-color="#FFD60A" style="--swatch:#FFD60A" aria-label="黄色" aria-pressed="false"></button>
    </nav>

    <section class="tool-panel" aria-label="绘画工具">
      <button class="tool-button selected" type="button" data-tool="normal" aria-pressed="true">普通笔</button>
      <button class="tool-button" type="button" data-tool="glow" aria-pressed="false">发光笔</button>
      <button class="tool-button" type="button" data-tool="stamp" aria-pressed="false">印章</button>
      <div id="stampChoices" class="stamp-choices" aria-label="印章图案">
        <button class="stamp-button selected" type="button" data-stamp="★" aria-label="星星印章" aria-pressed="true">★</button>
        <button class="stamp-button" type="button" data-stamp="♥" aria-label="爱心印章" aria-pressed="false">♥</button>
        <button class="stamp-button" type="button" data-stamp="✿" aria-label="花朵印章" aria-pressed="false">✿</button>
        <button class="stamp-button" type="button" data-stamp="☺" aria-label="笑脸印章" aria-pressed="false">☺</button>
      </div>
    </section>

    <section class="bottom-controls" aria-label="画笔粗细">
      <label for="size">粗细</label>
      <input id="size" type="range" min="1" max="30" value="8" step="1">
      <output id="sizeValue" for="size">8 px</output>
    </section>

    <aside id="status" class="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText">等待启动</span>
    </aside>
    <button id="musicToggle" class="music-toggle" type="button" aria-pressed="true" disabled>音乐：开</button>
    <button id="saveButton" class="save-button" type="button">保存作品</button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section id="startScreen" class="start-screen">
      <div class="start-card">
        <h1>隔空画板</h1>
        <p>右手食指绘画、捏合停笔；左手捏合取色，食指与中指比 V 可撤回，张掌后握拳可清屏。</p>
        <button id="startButton" class="start-button" type="button">启动摄像头</button>
        <span class="hint">请允许摄像头权限；建议使用 Chrome 或 Edge，并保持双手在画面内。</span>
      </div>
    </section>
    <p id="announcer" class="sr-only" aria-live="assertive"></p>
